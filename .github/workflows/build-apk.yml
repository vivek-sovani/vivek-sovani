name: Build Android APK

on:
  push:
    branches:
      - claude/windows-mobile-launcher-android-8k4oma
    paths:
      - 'WindowsMobileLauncher/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WindowsMobileLauncher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build the installable debug APK first and upload it immediately,
      # so a slow/failed release build can never block the deliverable.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMobileLauncher-debug-apk
          path: WindowsMobileLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: Windows Mobile Launcher - Latest Build
          prerelease: true
          body: |
            Debug build of the Windows Mobile Launcher for Android.

            **Install steps:**
            1. Download `app-debug.apk` below
            2. Transfer it to your Android phone (USB, email, or cloud)
            3. On your phone: Settings → Apps → Special app access → Install unknown apps → allow your file manager
            4. Tap the APK file to install
            5. Press Home → select **Windows Mobile Launcher** → tap Always
          files: WindowsMobileLauncher/app/build/outputs/apk/debug/*.apk

      # Release variant is best-effort. Lint-vital is disabled to keep it fast;
      # the APK is unsigned and only provided for convenience.
      - name: Build unsigned release APK
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Upload release APK (unsigned)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMobileLauncher-release-unsigned-apk
          path: WindowsMobileLauncher/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
