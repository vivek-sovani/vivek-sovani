name: Build Android APK

on:
  push:
    branches:
      - claude/windows-mobile-launcher-android-8k4oma
    paths:
      - 'WindowsMobileLauncher/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WindowsMobileLauncher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMobileLauncher-debug-apk
          path: WindowsMobileLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMobileLauncher-release-unsigned-apk
          path: WindowsMobileLauncher/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
